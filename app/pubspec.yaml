name: roadrescue
description: RoadRescue — reactive rescue, predictive maintenance, and emergency response.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # Bluetooth (OBD-II)
  flutter_blue_plus: ^1.32.12

  # State management
  provider: ^6.1.2

  # UI helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
