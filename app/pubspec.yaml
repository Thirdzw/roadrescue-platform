name: roadrescue
description: RoadRescue — phone-based crash detection, maintenance reminders, and emergency response.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # Maps & location
  google_maps_flutter: ^2.9.0
  geolocator: ^13.0.1

  # State management
  provider: ^6.1.2

  # UI helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  speech_to_text: ^7.5.0
  firebase_storage: ^12.4.10
  image_picker: ^1.2.3
  permission_handler: 12.0.1
  shared_preferences: 2.3.2
  flutter_secure_storage: 9.2.4
  sensors_plus: 6.1.2
  url_launcher: ^6.3.3
  flutter_phone_direct_caller: ^2.2.1
  flutter_foreground_task: ^8.17.0
  flutter_local_notifications: ^22.3.2
  another_telephony: ^0.4.1
  vibration: ^3.2.1
  audioplayers: ^6.8.1
  flutter_map: 7.0.2
  latlong2: 0.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/emergency_data.json
